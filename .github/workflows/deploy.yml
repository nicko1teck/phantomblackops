# Phantom Black Ops - continuous delivery to EC2 (Server A)
# Every push to master: check the code, package it, deploy it, restart, health-check.
#
# No keys or passwords are stored for this. GitHub gives each run a short-lived
# OIDC token; AWS swaps it for a temporary role (github-deploy-pbo) that may only
# upload to the deploy bucket and run commands on Server A.
#
# Required repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   AWS_DEPLOY_ROLE_ARN   ARN of the github-deploy-pbo role
#   EC2_INSTANCE_ID       Server A's instance ID
#
# The app's passwords stay in .env on the server and are never copied or overwritten.
# Server A runs 7 AM to 10 PM Central; a deploy outside those hours will time out.

name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch: # also allows a manual "Run workflow" button

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  BUCKET: nickowen-deploy-artifacts

jobs:
  check:
    name: Check code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets this job request its OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Only committed files go in, so .env and the database dump can never be shipped.
      - name: Package the release
        run: git archive --format=tar.gz -o release.tar.gz HEAD

      # Swap GitHub's OIDC token for temporary AWS credentials (pinned to a commit, as GitHub's docs show).
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Each commit gets its own folder, so nothing is ever overwritten.
      - name: Upload the release and install script to S3
        run: |
          PREFIX="pbo/$GITHUB_SHA"
          aws s3 cp release.tar.gz    "s3://$BUCKET/$PREFIX/release.tar.gz" --only-show-errors
          aws s3 cp deploy/install.sh "s3://$BUCKET/$PREFIX/install.sh"     --only-show-errors
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"

      # Run Command runs as root; the install itself runs as ec2-user, who owns the app and pm2.
      - name: Tell Server A to install it (SSM Run Command)
        run: |
          PARAMS=$(jq -n \
            --arg get "aws s3 cp s3://$BUCKET/$PREFIX/install.sh /tmp/pbo-install.sh --only-show-errors && chmod 755 /tmp/pbo-install.sh" \
            --arg run "sudo -iu ec2-user bash /tmp/pbo-install.sh $BUCKET $PREFIX/release.tar.gz" \
            '{commands: [$get, $run]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy phantomblackops ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "Command ID: $CMD_ID"
          echo "CMD_ID=$CMD_ID" >> "$GITHUB_ENV"

      - name: Wait for the result
        run: |
          STATUS="Pending"
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          echo "Status: $STATUS"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          case "$STATUS" in
            Success) echo "Deploy succeeded." ;;
            Failed)  echo "::error::The install script failed on Server A. See its output above."; exit 1 ;;
            Pending|InProgress|Delayed|Undeliverable|TimedOut|DeliveryTimedOut)
                     echo "::error::Server A never ran the command (status: $STATUS). Is it running? It's scheduled 7 AM to 10 PM Central."; exit 1 ;;
            *)       echo "::error::Deploy did not succeed (status: $STATUS)."; exit 1 ;;
          esac
